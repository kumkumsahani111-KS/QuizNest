
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Teacher Registration - QuizNest</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #f3efff;
            font-family: Arial, sans-serif;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 25px #34206020;
        }

        h1 {
            text-align: center;
            color: #6941c6;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            border: none;
            border-radius: 8px;
            background: #6941c6;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #5531a5;
        }

        .error {
            padding: 12px;
            background: #ffe5e5;
            color: #a00000;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .links {
            text-align: center;
            margin-top: 20px;
        }

        a {
            color: #6941c6;
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>QuizNest</h1>

        <p class="subtitle">
            Create your Teacher Account
        </p>

        {% if error %}
        <div class="error">
            {{ error }}
        </div>
        {% endif %}

        <form
            method="POST"
            action="{{ url_for('teacher_register') }}"
        >

            <label for="name">
                Full Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                maxlength="120"
                required
            >

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                minlength="3"
                maxlength="30"
                pattern="[a-zA-Z0-9_]+"
                required
            >

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                minlength="8"
                required
            >

            <label for="confirm_password">
                Confirm Password
            </label>

            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                minlength="8"
                required
            >

            <button type="submit">
                Create Account
            </button>

        </form>

        <div class="links">
            <p>
                Already have an account?
                <a href="{{ url_for('teacher_login') }}">
                    Login
                </a>
            </p>

            <a href="{{ url_for('home') }}">
                Back to Home
            </a>
        </div>

    </div>

</body>
</html>
